name: 🐛 Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please **remove API keys, secret keys and customer images** before you submit.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal code snippet or the steps in the plugin that trigger the bug.
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package or plugin version
      placeholder: e.g. 0.0.6
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Language/runtime version, OS, and for WordPress the WP and PHP versions.
      placeholder: e.g. Node 20, macOS 15 / WordPress 6.9, PHP 8.3
  - type: textarea
    id: logs
    attributes:
      label: Error output or logs
      description: Paste the error message, response body or stack trace.
      render: text
